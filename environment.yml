name: sim_rich_analysis_env
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pytorch-cpu
  - torchvision
  - pandas
  - numpy
  - scipy
  - matplotlib
  - pillow
  - tqdm
  - pytest
  # Only needed if config.BACKEND / config.EXTRA_BACKENDS includes "dinov3":
  # facebookresearch/dinov3's hubconf.py eagerly imports its full eval suite
  # (classifiers/depthers/detectors/dinotxt/segmentors), not just the plain
  # backbone this project actually calls, which transitively requires these
  # three (verified against the real dinov3 repo -- the rest of its
  # requirements.txt, e.g. scikit-learn/submitit/ftfy/regex, are only needed
  # by code paths this project never reaches, like text/detection eval).
  - omegaconf
  - torchmetrics
  - termcolor
  - pip
